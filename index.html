<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1; /* Soft Pink */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        #container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 { color: #d63384; }

        .buttons {
            margin-top: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            margin-right: 10px;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
        }

        .hidden { display: none; }
        
        img {
            max-width: 100%;
            border-radius: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="question-section">
            <h1>Rashi, will you be my valentine? 🌹</h1>
            <div class="buttons">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="response-section" class="hidden">
            <h1>Yay! I knew you'd say yes! ❤️</h1>
            <img src="https://media.tenor.com/97yXm6S86_0AAAAM/milk-and-mocha.gif" alt="Cute Cat Hug">
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionSection = document.getElementById('question-section');
        const responseSection = document.getElementById('response-section');

        // Logic to move the No button when hovered
        noBtn.addEventListener('mouseover', () => {
            // Calculate random positions within the container
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            noBtn.style.position = 'fixed'; // Make it move anywhere on screen
        });

        // Logic for clicking Yes
        yesBtn.addEventListener('click', () => {
            questionSection.classList.add('hidden');
            responseSection.classList.remove('hidden');
        });
    </script>
</body>
</html>
